name: Release

# Builds the installer and publishes a GitHub Release when the maintainer pushes a version
# tag such as v0.2.0. Nothing else triggers it.
on:
  push:
    tags: ['v*.*.*']

# vpk creates the release and uploads its files with the built-in token.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # Fixed for good: Velopack installs into %LOCALAPPDATA%\<packId> and finds updates by it.
  # Not "Naad", which would install over Naad's user data in %LOCALAPPDATA%\Naad.
  PACK_ID: Naad.App
  VPK_VERSION: 1.2.161

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, to check that the tagged commit is on main.
          fetch-depth: 0

      - name: Set up .NET from global.json
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # The tag is the single source of the version: it stamps Naad.exe and the package.
      - name: Read the version from the tag
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+)$') { throw "Version tags look like v1.2.3." }
          "value=$($Matches[1])" >> $env:GITHUB_OUTPUT

      # Only a commit already on main is released, whoever pushed the tag.
      - name: Check the tag is on main
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) { throw "The tagged commit isn't on main." }

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish Naad.exe
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: >-
          dotnet publish src/Naad --configuration Release --runtime win-x64 --self-contained
          -p:Version=$env:VERSION --output publish

      - name: Install vpk
        run: dotnet tool install --global vpk --version $env:VPK_VERSION

      # The release notes are the changelog from this version down: an installed copy shows the
      # sections newer than its own, so a user who skipped releases sees all of them.
      - name: Write the release notes
        env:
          VERSION: ${{ steps.version.outputs.value }}
        shell: pwsh
        run: |
          $changelog = Get-Content CHANGELOG.md -Raw
          $start = $changelog.IndexOf("## [$env:VERSION]")
          if ($start -lt 0) { throw "CHANGELOG.md has no section for $env:VERSION." }
          Set-Content -Path release-notes.md -Value $changelog.Substring($start) -Encoding utf8

      # ponytail: full packages only; add `vpk download github` before packing for delta
      # updates if download size starts to matter.
      - name: Pack the installer
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: >-
          vpk pack --packId $env:PACK_ID --packVersion $env:VERSION --packDir publish
          --mainExe Naad.exe --packTitle Naad --packAuthors "Naad contributors"
          --icon src/Naad/Assets/naad.ico --releaseNotes release-notes.md --outputDir releases

      # The release list names every file with its size and SHA-256, and is signed with Naad's
      # private key (ECDSA P-256), kept in the NAAD_UPDATE_SIGNING_KEY secret. Installed copies
      # hold the public key and install only releases whose list checks out (docs/releasing.md).
      - name: Sign the release list
        env:
          VERSION: ${{ steps.version.outputs.value }}
          SIGNING_KEY: ${{ secrets.NAAD_UPDATE_SIGNING_KEY }}
        shell: pwsh
        run: |
          if (-not $env:SIGNING_KEY) { throw "The NAAD_UPDATE_SIGNING_KEY secret is missing; see docs/releasing.md." }
          $files = @(Get-ChildItem releases -File | ForEach-Object {
            [ordered]@{
              name = $_.Name
              size = $_.Length
              sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          })
          $list = [ordered]@{
            packId = $env:PACK_ID
            version = $env:VERSION
            published = [DateTimeOffset]::UtcNow.ToString('o')
            files = $files
          }
          $bytes = [Text.UTF8Encoding]::new($false).GetBytes(($list | ConvertTo-Json -Depth 4 -Compress))
          $key = [Security.Cryptography.ECDsa]::Create()
          try {
            $key.ImportFromPem($env:SIGNING_KEY)
            $signature = $key.SignData($bytes, [Security.Cryptography.HashAlgorithmName]::SHA256)
          } finally {
            $key.Dispose()
          }
          # A secret that doesn't match a key built into Naad would publish a release that every
          # installed copy refuses: check against the public keys in AppUpdater.cs first.
          $source = Get-Content src/Naad/Updates/AppUpdater.cs -Raw
          $keys = [regex]::Matches($source, '-----BEGIN PUBLIC KEY-----[\s\S]*?-----END PUBLIC KEY-----')
          $trusted = $false
          foreach ($pem in $keys) {
            $public = [Security.Cryptography.ECDsa]::Create()
            try {
              $public.ImportFromPem(($pem.Value -split "`n" | ForEach-Object { $_.Trim() }) -join "`n")
              if ($public.VerifyData($bytes, $signature, [Security.Cryptography.HashAlgorithmName]::SHA256)) {
                $trusted = $true
              }
            } finally {
              $public.Dispose()
            }
          }
          if (-not $trusted) { throw "NAAD_UPDATE_SIGNING_KEY matches no public key in AppUpdater.cs." }
          New-Item -ItemType Directory signed | Out-Null
          [IO.File]::WriteAllBytes("signed/naad-release.json", $bytes)
          [IO.File]::WriteAllText("signed/naad-release.json.sig", [Convert]::ToBase64String($signature))

      # Uploaded as a draft first: no installed copy sees the release before its list is there.
      - name: Upload the GitHub Release as a draft
        env:
          VERSION: ${{ steps.version.outputs.value }}
          TAG: ${{ github.ref_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          vpk upload github --outputDir releases --repoUrl $env:REPO_URL --token $env:GITHUB_TOKEN
          --releaseName "Naad $env:VERSION" --tag $env:TAG

      - name: Attach the signed list and publish
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload $env:TAG signed/naad-release.json signed/naad-release.json.sig --repo $env:GITHUB_REPOSITORY
          gh release edit $env:TAG --draft=false --repo $env:GITHUB_REPOSITORY
